name: Repository standard

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-standard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    name: repository-standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Install pinned checker dependencies
        run: npm ci --prefix .standards --ignore-scripts --no-audit --no-fund
      - name: Install checksum-verified Gitleaks
        run: node .standards/install-gitleaks.mjs
      - name: Check complete proposed change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-list --max-parents=0 "$HEAD" | tail -n 1)"
          fi
          node .standards/check.mjs ci "$BASE" "$HEAD"
